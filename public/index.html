<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snowflakes</title>
<meta name="description" content="Share photos of snowflakes and swipe through the most beautiful ones. Free, no ads.">
<meta name="theme-color" content="#0b1a33">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snowflakes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="canonical" href="https://snowflakes.vanali.workers.dev/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Snowflakes">
<meta property="og:title" content="Snowflakes">
<meta property="og:description" content="Share photos of snowflakes and swipe through the most beautiful ones. Free, no ads.">
<meta property="og:url" content="https://snowflakes.vanali.workers.dev/">
<meta property="og:image" content="https://snowflakes.vanali.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="sneeuw" aria-hidden="true"></div>

<header class="kop">
  <a class="merk" href="#/" aria-label="Snowflakes">
    <svg class="merk-vlok" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><use href="#vlok"/></svg>
    <span>Snowflakes</span>
  </a>
  <button class="wie" id="wie" type="button"></button>
</header>

<main id="inhoud" tabindex="-1">

  <!-- swipen -->
  <section class="scherm" id="s-swipe" data-scherm="swipe" hidden>
    <h1 class="sr" id="swipeTitel"></h1>
    <div class="stapel" id="stapel" aria-live="polite"></div>
    <div class="leegstapel" id="leegstapel" hidden>
      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><use href="#vlok"/></svg>
      <p id="leegTekst"></p>
      <div class="knoppenrij">
        <a class="knop" href="#/top" id="leegTop"></a>
        <a class="knop licht" href="#/upload" id="leegUpload"></a>
      </div>
    </div>
    <div class="keuzes" id="keuzes">
      <button class="rond nee" id="nee" type="button"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="rond ja" id="ja" type="button"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><use href="#hart"/></svg></button>
    </div>
  </section>

  <!-- top -->
  <section class="scherm" id="s-top" data-scherm="top" hidden>
    <h1 id="topTitel"></h1>
    <div class="tabs" role="tablist" id="topTabs">
      <button type="button" role="tab" data-periode="day"></button>
      <button type="button" role="tab" data-periode="week"></button>
      <button type="button" role="tab" data-periode="all"></button>
    </div>
    <ol class="raster" id="topLijst"></ol>
    <p class="leeg" id="topLeeg" hidden></p>
  </section>

  <!-- favorieten -->
  <section class="scherm" id="s-favorites" data-scherm="favorites" hidden>
    <h1 id="favTitel"></h1>
    <ul class="raster" id="favLijst"></ul>
    <p class="leeg" id="favLeeg" hidden></p>
  </section>

  <!-- mijn foto's -->
  <section class="scherm" id="s-mine" data-scherm="mine" hidden>
    <h1 id="mijnTitel"></h1>
    <p class="hartjes" id="mijnHartjes"></p>
    <ul class="raster" id="mijnLijst"></ul>
    <p class="leeg" id="mijnLeeg" hidden></p>
  </section>

  <!-- uploaden -->
  <section class="scherm" id="s-upload" data-scherm="upload" hidden>
    <h1 id="upTitel"></h1>
    <p class="uitleg" id="upUitleg"></p>
    <label class="kiezer" id="upKiezer">
      <input type="file" id="upBestand" accept="image/*" class="sr">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="upKies"></span>
    </label>
    <div class="voorbeeld" id="upVoorbeeld" hidden>
      <img id="upBeeld" alt="">
      <button type="button" class="tekstknop" id="upAnder"></button>
    </div>
    <label class="vinkje" id="upToestemmingRij" hidden>
      <input type="checkbox" id="upToestemming">
      <span id="upToestemmingTekst"></span>
    </label>
    <button type="button" class="knop groot" id="upVerstuur" hidden></button>
    <p class="melding-tekst" id="upMelding" role="status"></p>
  </section>

  <!-- account -->
  <section class="scherm" id="s-account" data-scherm="account" hidden>
    <h1 id="accTitel"></h1>
    <form class="bijnaamform" id="accNaamForm">
      <label for="accNaam" id="accNaamLabel"></label>
      <div class="invoerrij">
        <input id="accNaam" maxlength="24" autocomplete="nickname" spellcheck="false">
        <button type="submit" class="knop" id="accNaamOpslaan"></button>
      </div>
      <p class="melding-tekst" id="accNaamMelding" role="status"></p>
    </form>
    <a class="knop licht breed" href="#/admin" id="accBeheer" hidden></a>
    <button type="button" class="knop licht breed" id="accUitloggen"></button>
    <details class="gevaarzone">
      <summary id="accVerwijderKop"></summary>
      <p id="accVerwijderUitleg"></p>
      <button type="button" class="knop gevaar" id="accVerwijder"></button>
    </details>
    <h2 id="privTitel"></h2>
    <div class="privacy" id="privTekst"></div>
    <p class="contact"><a id="contactLink" href="https://github.com/boulbaal/snowflakes/issues" target="_blank" rel="noopener"></a></p>
  </section>

  <!-- beheer (alleen Ali) -->
  <section class="scherm" id="s-admin" data-scherm="admin" hidden>
    <h1 id="admTitel"></h1>
    <ul class="wachtrij" id="admLijst"></ul>
    <p class="leeg" id="admLeeg" hidden></p>
  </section>

</main>

<footer class="voet" id="voet">
  <button class="voetknop" id="doneerKnop" type="button" aria-expanded="false" aria-controls="doneerPaneel"></button>
  <span class="stip" aria-hidden="true">·</span>
  <label class="taal">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g></svg>
    <select id="taal"></select>
  </label>
  <span class="stip" aria-hidden="true">·</span>
  <span class="versie" id="versie">dev</span>
  <button class="ververs" id="ververs" type="button">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V9h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</footer>
<div class="doneerpaneel" id="doneerPaneel" hidden></div>

<nav class="balk" id="balk">
  <a href="#/" data-naar="swipe"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><use href="#vlok"/></svg><span id="navSwipe"></span></a>
  <a href="#/top" data-naar="top"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4ZM7 6H4.5v1A3.5 3.5 0 0 0 8 10.5M17 6h2.5v1a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8.5 20h7M10 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="navTop"></span></a>
  <a href="#/upload" data-naar="upload" class="plus"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span id="navUpload"></span></a>
  <a href="#/favorites" data-naar="favorites"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><use href="#hart-lijn"/></svg><span id="navFav"></span></a>
  <a href="#/mine" data-naar="mine"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h2.2l1.4-2h5.8l1.4 2h2.2A1.5 1.5 0 0 1 20 7.5v10a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5v-10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span id="navMine"></span></a>
</nav>

<!-- vellen: inloggen, bijnaam, melden, groot beeld -->
<div class="vel" id="velLogin" role="dialog" aria-modal="true" aria-labelledby="loginTitel" hidden>
  <div class="vel-binnen">
    <h2 id="loginTitel"></h2>
    <p id="loginUitleg"></p>
    <div class="google" id="googleKnop"></div>
    <p class="melding-tekst" id="loginMelding" role="alert"></p>
    <p class="klein" id="loginPrivacy"></p>
    <button type="button" class="tekstknop" id="loginDicht"></button>
  </div>
</div>

<div class="vel" id="velNaam" role="dialog" aria-modal="true" aria-labelledby="naamTitel" hidden>
  <form class="vel-binnen" id="naamForm">
    <h2 id="naamTitel"></h2>
    <p id="naamUitleg"></p>
    <input id="naamInvoer" maxlength="24" autocomplete="nickname" spellcheck="false" aria-labelledby="naamTitel">
    <p class="melding-tekst" id="naamMelding" role="alert"></p>
    <button type="submit" class="knop groot" id="naamOk"></button>
  </form>
</div>

<div class="vel" id="velMeld" role="alertdialog" aria-modal="true" aria-labelledby="meldTitel" hidden>
  <div class="vel-binnen">
    <h2 id="meldTitel"></h2>
    <p id="meldUitleg"></p>
    <div class="knoppenrij">
      <button type="button" class="knop licht" id="meldNee"></button>
      <button type="button" class="knop gevaar" id="meldJa"></button>
    </div>
  </div>
</div>

<div class="beeldscherm" id="grootBeeld" role="dialog" aria-modal="true" hidden>
  <img id="grootImg" alt="">
  <p class="beeldscherm-door" id="grootDoor"></p>
  <div class="beeldscherm-acties" id="grootActies"></div>
  <button type="button" class="beeldscherm-dicht" id="grootDicht"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</div>

<p class="toast" id="toast" role="status" aria-live="polite"></p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="vlok" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5"/>
      <path d="M9.6 4.2 12 6.3l2.4-2.1M9.6 19.8 12 17.7l2.4 2.1M4.7 10.4l3.1-.9-.7-3.1M19.3 13.6l-3.1.9.7 3.1M4.7 13.6l3.1.9-.7 3.1M19.3 10.4l-3.1-.9.7-3.1"/>
    </g>
    <path id="hart" fill="currentColor" d="M12 20.3 4.6 13a4.7 4.7 0 0 1 6.6-6.7l.8.8.8-.8a4.7 4.7 0 0 1 6.6 6.7L12 20.3Z"/>
    <path id="hart-lijn" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 19.6 5.1 12.8a4.4 4.4 0 0 1 6.2-6.3l.7.7.7-.7a4.4 4.4 0 0 1 6.2 6.3L12 19.6Z"/>
  </defs>
</svg>
<noscript><p class="noscript">Snowflakes needs JavaScript.</p></noscript>
</body>
</html>
